name: Build signed Android APK

on:
  push:
    branches:
      - arena/01a08fcb-qaharness
    paths-ignore:
      - 'export/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_DIR: QAHarness
  APK_EXPORT_DIR: export
  APK_EXPORT_NAME: QAHarness-release-signed.apk
  QAHARNESS_STORE_PASS: qaharness123
  QAHARNESS_KEY_PASS: qaharness123

jobs:
  build:
    name: Build, sign, verify, and export APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK command-line tools and packages
        shell: bash
        run: |
          set -o pipefail
          mkdir -p export
          {
            set -eux
            ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
            ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
            echo "Initial ANDROID_HOME=${ANDROID_HOME}"
            echo "Initial ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
            ls -la "${ANDROID_HOME}" || true
            find "${ANDROID_HOME}" -maxdepth 4 -type f -name sdkmanager -print || true
            SDKMANAGER=""
            if [ -d "${ANDROID_HOME}" ]; then
              SDKMANAGER="$(find "${ANDROID_HOME}" -path '*/cmdline-tools/*/bin/sdkmanager' -type f | sort -V | tail -n 1 || true)"
            fi
            if [ -z "${SDKMANAGER}" ] || [ ! -x "${SDKMANAGER}" ]; then
              ANDROID_HOME="$HOME/android-sdk"
              ANDROID_SDK_ROOT="$ANDROID_HOME"
              rm -rf "${ANDROID_HOME}"
              mkdir -p "${ANDROID_HOME}/cmdline-tools" "${RUNNER_TEMP}/android-cmdline"
              cd "${RUNNER_TEMP}"
              curl --retry 3 --retry-delay 5 -fL -o commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
              ls -lh commandlinetools.zip
              python3 - <<'PY'
          from pathlib import Path
          p=Path('commandlinetools.zip')
          print(p.read_bytes()[:128])
          PY
              rm -rf "${RUNNER_TEMP}/android-cmdline"
              mkdir -p "${RUNNER_TEMP}/android-cmdline"
              unzip -q commandlinetools.zip -d "${RUNNER_TEMP}/android-cmdline"
              mv "${RUNNER_TEMP}/android-cmdline/cmdline-tools" "${ANDROID_HOME}/cmdline-tools/latest"
              SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            fi
            test -x "${SDKMANAGER}"
            echo "ANDROID_HOME=${ANDROID_HOME}" >> "${GITHUB_ENV}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "${GITHUB_ENV}"
            echo "Using sdkmanager: ${SDKMANAGER}"
            yes | "${SDKMANAGER}" --licenses >/dev/null || true
            "${SDKMANAGER}" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
            ls "${ANDROID_HOME}/platforms/android-34"
            ls "${ANDROID_HOME}/build-tools"
          } 2>&1 | tee export/android-sdk-install.log
          exit "${PIPESTATUS[0]}"

      - name: Install OpenCV 4.9.0 Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          cd "${RUNNER_TEMP}"
          curl -fL -o opencv-android-sdk.zip \
            https://github.com/opencv/opencv/releases/download/4.9.0/opencv-4.9.0-android-sdk.zip \
            || curl -fL -o opencv-android-sdk.zip \
            "https://sourceforge.net/projects/opencvlibrary/files/4.9.0/opencv-4.9.0-android-sdk.zip/download"
          unzip -q opencv-android-sdk.zip
          test -f "${RUNNER_TEMP}/OpenCV-android-sdk/sdk/build.gradle"
          echo "OPENCV_SDK_DIR=${RUNNER_TEMP}/OpenCV-android-sdk/sdk" >> "${GITHUB_ENV}"
          ls "${RUNNER_TEMP}/OpenCV-android-sdk/sdk"

      - name: Configure project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path('gradle.properties')
          lines = p.read_text().splitlines()
          out = []
          replaced = False
          for line in lines:
              if line.startswith('opencvSdkDir='):
                  out.append(f"opencvSdkDir={os.environ['OPENCV_SDK_DIR']}")
                  replaced = True
              else:
                  out.append(line)
          if not replaced:
              out.append(f"opencvSdkDir={os.environ['OPENCV_SDK_DIR']}")
          p.write_text('\n'.join(out) + '\n')
          PY
          printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > local.properties
          if [ ! -f app/qaharness.jks ]; then
            keytool -genkeypair -v \
              -keystore app/qaharness.jks \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias qaharness \
              -storepass "${QAHARNESS_STORE_PASS}" \
              -keypass "${QAHARNESS_KEY_PASS}" \
              -dname "CN=QA, OU=Dev, O=QA, L=City, S=State, C=PK"
          fi
          cat local.properties
          grep '^opencvSdkDir=' gradle.properties

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper if missing
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../export
          {
            set -eux
            pwd
            ls -la
            gradle --version
            if [ ! -x ./gradlew ]; then
              gradle wrapper --gradle-version 8.7 --stacktrace --no-daemon
            fi
            chmod +x ./gradlew
            ./gradlew --version --no-daemon
          } 2>&1 | tee ../export/gradle-wrapper.log
          exit "${PIPESTATUS[0]}"

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../export
          {
            set -eux
            ./gradlew clean assembleRelease --stacktrace --no-daemon
            find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -exec ls -lh {} \;
          } 2>&1 | tee ../export/gradle-build.log
          exit "${PIPESTATUS[0]}"

      - name: Verify, hash, and stage APK export
        shell: bash
        run: |
          set -euxo pipefail
          APK="${PROJECT_DIR}/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "${APK}" ]; then
            APK="${PROJECT_DIR}/app/build/outputs/apk/release/app-release-unsigned.apk"
          fi
          test -f "${APK}"
          mkdir -p "${APK_EXPORT_DIR}"
          cp "${APK}" "${APK_EXPORT_DIR}/${APK_EXPORT_NAME}"
          "${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --verbose "${APK_EXPORT_DIR}/${APK_EXPORT_NAME}" | tee "${APK_EXPORT_DIR}/apksigner-verify.txt"
          sha256sum "${APK_EXPORT_DIR}/${APK_EXPORT_NAME}" | tee "${APK_EXPORT_DIR}/sha256.txt"
          ls -lh "${APK_EXPORT_DIR}/${APK_EXPORT_NAME}" | tee "${APK_EXPORT_DIR}/size.txt"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QAHarness-release-signed
          path: |
            export/QAHarness-release-signed.apk
            export/apksigner-verify.txt
            export/sha256.txt
            export/size.txt
          if-no-files-found: error

      - name: Commit APK export to this branch
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${APK_EXPORT_DIR}/${APK_EXPORT_NAME}" "${APK_EXPORT_DIR}/apksigner-verify.txt" "${APK_EXPORT_DIR}/sha256.txt" "${APK_EXPORT_DIR}/size.txt"
          git commit -m "Export signed QAHarness APK [skip ci]" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Commit failure diagnostics to this branch
        if: failure()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p export
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF_NAME}"
            date -u
            find export -maxdepth 1 -type f -print -exec ls -lh {} \;
          } > export/failure-diagnostics.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add export/*.log export/failure-diagnostics.txt || true
          git commit -m "Add APK workflow failure diagnostics [skip ci]" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
